name: rss-to-discord

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rss-to-discord
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Poll feed and send new items
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python rss_to_discord.py

      - name: Commit state registry
        if: always()
        run: |
          set -u
          if [ ! -f state.json ]; then
            echo "state.json does not exist; skipping commit"
            exit 0
          fi
          if git ls-files --error-unmatch state.json >/dev/null 2>&1 && git diff --quiet -- state.json; then
            echo "state.json unchanged; skipping commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          git commit -m "chore(state): update RSS registry"
          for attempt in 1 2 3 4 5; do
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "state.json pushed"
              exit 0
            fi
            echo "push failed (attempt ${attempt}); rebasing"
            sleep $((attempt * 3))
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
          done
          echo "failed to push state.json after retries" >&2
          exit 1
